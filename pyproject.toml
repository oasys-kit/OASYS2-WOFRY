[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OASYS2-WOFRY"
version = "1.0.16"
description = "WOFRY (Wave Optics FRamework in pYthon)"
readme = "README.md"

# TODO: confirm the exact GPL variant (the old setup.py just said 'GPLv3',
# and there is no License:: classifier here to cross-check against).
license = "GPL-3.0-or-later"
# license = "GPL-3.0-only"      # <- if the source headers say "version 3" only
# license-files = ["LICENSE"]   # <- uncomment if a LICENSE file exists in the repo

authors = [
    { name = "Manuel Sanchez del Rio", email = "srio@esrf.eu" },
    { name = "Luca Rebuffi", email = "lrebuffi@anl.gov" },
]
keywords = [
    "simulator",
    "waveoptics",
    "oasys2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
    "Environment :: Plugins",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "oasys2>=0.0.54",
    "syned-gui-2>=1.0.4",
    "wofryimpl>=1.0.38",
]

[project.urls]
Homepage = "https://github.com/oasys-kit/OASYS2-WOFRY"
Download = "https://github.com/oasys-kit/OASYS2-WOFRY"

[project.entry-points."oasys2.addons"]
wofry = "orangecontrib.wofry"

[project.entry-points."oasys2.widgets"]
"Wofry Wavefront Propagation" = "orangecontrib.wofry.widgets.wavefront_propagation"
"Wofry Optical Elements" = "orangecontrib.wofry.widgets.beamline_elements"
"Wofry Tools" = "orangecontrib.wofry.widgets.tools"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]
# namespaces = false replicates the old find_packages() behaviour exactly.
# Under pyproject.toml, setuptools DEFAULTS this to true (= find_namespace_packages),
# which would sweep in non-package dirs such as .../icons.
namespaces = false

[tool.setuptools.package-data]
"orangecontrib.wofry.widgets.wavefront_propagation" = ["icons/*.png", "icons/*.jpg"]
"orangecontrib.wofry.widgets.beamline_elements" = ["icons/*.png", "icons/*.jpg"]
"orangecontrib.wofry.widgets.tools" = ["icons/*.png", "icons/*.jpg"]